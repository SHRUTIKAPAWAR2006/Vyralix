<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vyralix App</title>
  
  <!-- Google Fonts: Chakra Petch & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Chakra Petch', 'sans-serif'],

          colors: {
            bg: '#0d1210',
            card: '#141a17',

            primary: '#e8e6e0',
            muted: '#7a8580',
            teal: '#4dd8c4',
            gold: '#d4a24c',
          }
        }
      }
    }

<body class="bg-[#0d1210] text-[#e8e6e0] font-sans min-h-screen antialiased selection:bg-[#4dd8c4] selection:text-[#0d1210]">

  <script type="module" src="/src/main.jsx"></script>
