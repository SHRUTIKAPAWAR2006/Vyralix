<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Vyralix</title>
  
  <!-- Google Fonts: Chakra Petch (Headings) & Inter (Body Text) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Tailwind CSS CDN Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Chakra Petch', 'sans-serif'],
          },
          colors: {
            bg: '#0d1210',
            card: '#141a17',
            border: '#2a3330',
            primary: '#e8e6e0',
            muted: '#7a8580',
            teal: '#4dd8c4',
            gold: '#d4a24c',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-[#0d1210] text-[#e8e6e0] font-sans min-h-screen antialiased selection:bg-[#4dd8c4] selection:text-[#0d1210]">

  <!-- NAVBAR: Brand logo, search bar & actions   -->
  <header class="bg-[#0d1210] border-b border-[#2a3330] sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between gap-6">
      
      <!-- Brand Wordmark -->
      <a href="index.html" class="font-heading font-bold text-2xl tracking-tight text-[#e8e6e0]">
        Vyralix
      </a>

      <!-- Search Input (Hidden on mobile screens) -->
      <div class="relative w-72 hidden sm:block">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-[#7a8580]">
          <i data-lucide="search" class="w-4 h-4" stroke-width="1.5"></i>
        </div>
        <input 
          type="text" 
          placeholder="Search creators, 3D art..." 
          class="w-full bg-[#141a17] border border-[#2a3330] rounded-md pl-9 pr-3 py-1.5 text-xs text-[#e8e6e0] placeholder-[#7a8580] focus:outline-none focus:border-[#4dd8c4] transition-colors"
        >
      </div>

      <!-- User Action Controls -->
      <div class="flex items-center gap-4">
        <!-- Create CTA Button -->
        <button class="bg-[#4dd8c4] text-[#0d1210] font-semibold text-xs px-4 py-2 rounded-md border-0 outline-none ring-0 hover:bg-[#3ec4b1] transition-colors flex items-center gap-1.5 shadow-[0_0_12px_rgba(77,216,196,0.3)]">
          <i data-lucide="plus" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Create</span>
        </button>

        <!-- Notification Bell Icon -->
        <button class="text-[#7a8580] hover:text-[#e8e6e0] transition-colors" aria-label="Notifications">
          <i data-lucide="bell" class="w-5 h-5" stroke-width="1.5"></i>
        </button>

        <!-- Profile Avatar Circle -->
        <a href="dashboard.html" aria-label="My Profile">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" 
            alt="Profile Avatar" 
            class="w-8 h-8 rounded-full object-cover"
          >
        </a>
      </div>

    </div>
  </header>

  <!-- MAIN LAYOUT: Left Sidebar + Dashboard Body -->
  <div class="max-w-6xl mx-auto px-6 py-8 flex gap-8">

    <!-- LEFT SIDEBAR: Navigation Menu              -->
 
    <aside class="w-52 flex-shrink-0 hidden md:block">
      <nav class="space-y-1 sticky top-24">
        
        <a href="index.html" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="home" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Home</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="compass" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Explore</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="upload" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Upload</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="activity" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Activity</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="trophy" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Leaderboard</span>
        </a>

        <a href="#" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="award" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Badges</span>
        </a>

        <!-- Active Link: Profile (Teal left border & teal text) --> 
        <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-[#4dd8c4] bg-[#141a17] text-[#4dd8c4] font-medium text-xs rounded-r-md">
          <i data-lucide="user" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Profile</span>
        </a>

        <a href="login.html" class="flex items-center gap-3 px-3 py-2 border-l-2 border-l-transparent text-[#7a8580] hover:text-[#e8e6e0] hover:bg-[#141a17]/50 font-medium text-xs rounded-r-md transition-colors">
          <i data-lucide="settings" class="w-4 h-4" stroke-width="1.5"></i>
          <span>Settings</span>
        </a>

      </nav>
    </aside>

    <!-- MAIN DASHBOARD CONTENT                     -->
    <main class="flex-1 space-y-8">

      <!-- PROFILE HEADER & XP PROGRESS CARD          -->
      <div class="bg-[#141a17] border border-[#2a3330] border-t-2 border-t-[#4dd8c4]/40 rounded-md p-6 space-y-6">
        
        <!-- Avatar, Creator Name, Handle & Edit Button -->
        <div class="flex items-center justify-between gap-4">
          <div class="flex items-center gap-4">
            <img 
              src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" 
              alt="Alex Rivers" 
              class="w-16 h-16 rounded-full object-cover"
            >
            
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <h1 class="font-heading font-semibold text-lg text-[#e8e6e0]">Alex Rivers</h1>
                <!-- Gold Underlined Level Tag -->
                <span class="text-xs text-[#d4a24c] font-medium border-b border-[#d4a24c]/40 pb-0.5 ml-1">LVL 35</span>
              </div>
              <p class="text-xs text-[#7a8580]">@alex_rivers</p>
            </div>
          </div>

          <button class="px-3.5 py-1.5 bg-[#0d1210] border border-[#2a3330] hover:border-[#4dd8c4] text-xs font-medium text-[#e8e6e0] rounded-md transition-colors">
            Edit Profile
          </button>
        </div>

        <!-- Flat XP Progress Bar (No glow, flat track) -->
        <div class="space-y-1.5 pt-4 border-t border-[#2a3330]">
          <div class="flex justify-between items-center text-xs">
            <span class="text-[#e8e6e0] font-medium">Level 35 Progress</span>
            <span class="text-[#d4a24c] font-mono font-medium">2,450 / 3,000 XP</span>
          </div>
          <div class="w-full h-2 bg-[#2a3330] rounded-full overflow-hidden">
            <div class="h-full bg-[#d4a24c] rounded-full" style="width: 81%;"></div>
          </div>
        </div>

      </div>

      <!-- STATS ROW: Flat Number + Label Pairs       -->
      <div class="grid grid-cols-3 gap-6 py-4 border-y border-[#2a3330] text-center sm:text-left">
        <div class="space-y-1">
          <span class="text-xs text-[#7a8580] font-medium uppercase tracking-wider">Posts</span>
          <div class="font-heading font-semibold text-2xl text-[#e8e6e0]">48</div>
        </div>

        <div class="space-y-1">
          <span class="text-xs text-[#7a8580] font-medium uppercase tracking-wider">Followers</span>
          <div class="font-heading font-semibold text-2xl text-[#e8e6e0]">12.4k</div>
        </div>

        <div class="space-y-1">
          <span class="text-xs text-[#7a8580] font-medium uppercase tracking-wider">Following</span>
          <div class="font-heading font-semibold text-2xl text-[#e8e6e0]">342</div>
        </div>
      </div>

      <!-- TABS & BADGES SHOWCASE GRID                -->
      <div class="space-y-6">
        
        <!-- Underline Category Tabs -->
        <div class="flex items-center gap-6 border-b border-[#2a3330] pb-2 text-xs font-medium">
          <button class="border-b-2 border-b-[#4dd8c4] text-[#e8e6e0] font-semibold pb-2">
            Posts
          </button>
          <button class="border-b-2 border-b-transparent text-[#7a8580] hover:text-[#e8e6e0] pb-2 transition-colors">
            Likes
          </button>
          <button class="border-b-2 border-b-transparent text-[#7a8580] hover:text-[#e8e6e0] pb-2 transition-colors">
            Badges
          </button>
        </div>

        <!-- Badges Tiles Section -->
        <div class="space-y-4">
          <h3 class="font-heading font-semibold text-xs text-[#7a8580] uppercase tracking-wider">Badges</h3>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
            
            <!-- Unlocked Badge 1 -->
            <div class="bg-[#141a17] border border-[#2a3330] rounded-md p-4 flex flex-col items-center justify-center gap-2 text-center">
              <i data-lucide="star" class="w-6 h-6 text-[#4dd8c4]" stroke-width="1.5"></i>
              <span class="text-xs text-[#e8e6e0] font-medium">Genesis Creator</span>
            </div>

            <!-- Unlocked Badge 2 -->
            <div class="bg-[#141a17] border border-[#2a3330] rounded-md p-4 flex flex-col items-center justify-center gap-2 text-center">
              <i data-lucide="palette" class="w-6 h-6 text-[#4dd8c4]" stroke-width="1.5"></i>
              <span class="text-xs text-[#e8e6e0] font-medium">Pixel Master</span>
            </div>

            <!-- Unlocked Badge 3 -->
            <div class="bg-[#141a17] border border-[#2a3330] rounded-md p-4 flex flex-col items-center justify-center gap-2 text-center">
              <i data-lucide="film" class="w-6 h-6 text-[#4dd8c4]" stroke-width="1.5"></i>
              <span class="text-xs text-[#e8e6e0] font-medium">Animation Wizard</span>
            </div>

            <!-- Locked Badge (Greyscale desaturated tile) -->
            <div class="bg-[#141a17] border border-[#2a3330] rounded-md p-4 flex flex-col items-center justify-center gap-2 text-center opacity-50">
              <i data-lucide="lock" class="w-6 h-6 text-[#7a8580]" stroke-width="1.5"></i>
              <span class="text-xs text-[#7a8580] font-medium">Level 50 Titan</span>
            </div>

          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- Lucide Icons Initialization Script -->
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
